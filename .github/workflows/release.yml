name: Publicación

# Binarios estáticos (x86_64 y aarch64) e imagen de Docker multiarquitectura.
# - En cada cambio de los archivos de despliegue: se construye y se prueba todo, sin publicar.
# - Con una etiqueta vX.Y.Z: además se crea la versión en GitHub y se sube la imagen a ghcr.io.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/build-release.sh'
      - 'scripts/check-deploy.sh'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/build-release.sh'
      - 'scripts/check-deploy.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ownfm

jobs:
  binarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-deploy.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: (cd web && flutter pub get)
      - run: scripts/build-release.sh
      - name: El binario arranca y responde
        run: |
          file dist/ownfm-*
          B=dist/ownfm-x86_64-linux-musl
          $B version
          OWNFM_DATA_DIR=$RUNNER_TEMP/ownfm OWNFM_LISTEN=127.0.0.1:18090 $B serve & sleep 3
          OWNFM_LISTEN=127.0.0.1:18090 $B healthcheck
          curl -fsS http://127.0.0.1:18090/ | grep -qi flutter
          curl -fsS http://127.0.0.1:18090/api/v1/openapi.json | jq -e '.openapi == "3.1.0"'
          ls $RUNNER_TEMP/ownfm
      - name: Instalador en un sistema con systemd (este mismo runner)
        run: |
          # Instalación antigua (GordurasFM v0.1.3) → OwnFM: conserva la clave y la BD, y quita lo antiguo.
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/v0.1.3/deploy/lxc/install.sh \
            | sudo bash -s -- --version v0.1.3 --navidrome-url http://127.0.0.1:4533
          curl -fsS http://127.0.0.1:8090/api/v1/salud
          KEY=$(sudo sha256sum /etc/gordurasfm/master.key | cut -d' ' -f1)
          sudo deploy/lxc/install.sh --binary dist/ownfm-x86_64-linux-musl
          test "$(SUDO_ASKPASS="$__hermes_sudo_dir/a" sudo "${__hermes_sudo_o[@]}" sha256sum /etc/ownfm/master.key | cut -d' ' -f1)" = "$KEY"
          sudo test -f /var/lib/ownfm/ownfm.db
          sudo test ! -e /var/lib/ownfm/gordurasfm.db
          test ! -e /etc/gordurasfm
          test ! -e /var/lib/gordurasfm
          test ! -e /usr/local/bin/gordurasfm
          test ! -e /etc/systemd/system/gordurasfm.service
          id ownfm
          if id gordurasfm 2>/dev/null; then echo "el usuario gordurasfm debía renombrarse"; exit 1; fi
          sudo ls /var/lib/ownfm/backups | grep -q '^manual-'
          sudo grep -q '/var/lib/ownfm' /etc/ownfm/config.toml
          curl -fsS http://127.0.0.1:8090/api/v1/salud
          # Volver a lanzarlo ya es una actualización normal.
          sudo deploy/lxc/install.sh --binary dist/ownfm-x86_64-linux-musl --navidrome-url http://127.0.0.1:4533
          systemctl status ownfm --no-pager
          sudo test -f /etc/ownfm/master.key
          sudo stat -c '%U %a %n' /etc/ownfm/master.key /etc/ownfm/config.toml /var/lib/ownfm
          # Actualizar con el mismo binario: copia de la BD y vuelta a arrancar.
          sudo ownfm-update --binary dist/ownfm-x86_64-linux-musl
          sudo ls /var/lib/ownfm/backups | grep -q '^manual-'
          curl -fsS http://127.0.0.1:8090/api/v1/salud
          # Una versión que no arranca: debe volver sola a la anterior.
          printf '#!/bin/sh\n[ "$1" = version ] && echo "ownfm 9.9.9" && exit 0\nexit 1\n' > roto && chmod +x roto
          if sudo ownfm-update --binary ./roto; then echo "la actualización rota debía fallar"; exit 1; fi
          if /usr/local/bin/ownfm version | grep -q 9.9.9; then echo "debía volver a la versión anterior"; exit 1; fi
          curl -fsS http://127.0.0.1:8090/api/v1/salud
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
      - name: Versión en GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "OwnFM $GITHUB_REF_NAME" \
            dist/ownfm-x86_64-linux-musl dist/ownfm-aarch64-linux-musl dist/SHA256SUMS

  docker:
    needs: binarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: chmod +x dist/linux/*/ownfm
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Imagen amd64 y prueba
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ownfm:prueba
      - name: Arranca, pasa el healthcheck y responde
        run: |
          docker images ownfm:prueba --format '{{.Size}}'
          docker run -d --name ownfm -p 18090:8090 ownfm:prueba
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' ownfm); [ "$s" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' ownfm | grep -qx healthy
          curl -fsS http://127.0.0.1:18090/api/v1/salud
          docker exec ownfm /ownfm backup
          docker logs ownfm 2>&1 | tail -5
      - name: Imagen arm64 (emulada) arranca
        run: |
          docker buildx build --platform linux/arm64 --load -t ownfm:arm64 .
          docker run --rm --platform linux/arm64 ownfm:arm64 version
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Publicar en ghcr.io (amd64 + arm64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
