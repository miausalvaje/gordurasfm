name: Publicación

# Binarios estáticos (x86_64 y aarch64) e imagen de Docker multiarquitectura.
# - En cada cambio de los archivos de despliegue: se construye y se prueba todo, sin publicar.
# - Con una etiqueta vX.Y.Z: además se crea la versión en GitHub y se sube la imagen a ghcr.io.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/build-release.sh'
      - 'scripts/check-deploy.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gordurasfm

jobs:
  binarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-deploy.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: (cd web && flutter pub get)
      - run: scripts/build-release.sh
      - name: El binario arranca y responde
        run: |
          file dist/gordurasfm-*
          B=dist/gordurasfm-x86_64-linux-musl
          $B version
          GFM_DATA_DIR=$RUNNER_TEMP/gfm GFM_LISTEN=127.0.0.1:18090 $B serve & sleep 3
          GFM_LISTEN=127.0.0.1:18090 $B healthcheck
          curl -fsS http://127.0.0.1:18090/ | grep -qi flutter
          curl -fsS http://127.0.0.1:18090/api/v1/openapi.json | jq -e '.openapi == "3.1.0"'
          ls $RUNNER_TEMP/gfm
      - name: Instalador en un sistema con systemd (este mismo runner)
        run: |
          sudo deploy/lxc/install.sh --binary dist/gordurasfm-x86_64-linux-musl --navidrome-url http://127.0.0.1:4533
          systemctl status gordurasfm --no-pager
          sudo test -f /etc/gordurasfm/master.key
          sudo stat -c '%U %a %n' /etc/gordurasfm/master.key /etc/gordurasfm/config.toml /var/lib/gordurasfm
          # Actualizar con el mismo binario: copia de la BD y vuelta a arrancar.
          sudo gordurasfm-update --binary dist/gordurasfm-x86_64-linux-musl
          sudo ls /var/lib/gordurasfm/backups | grep -q '^manual-'
          curl -fsS http://127.0.0.1:8090/api/v1/salud
          # Una versión que no arranca: debe volver sola a la anterior.
          printf '#!/bin/sh\n[ "$1" = version ] && echo "gordurasfm 9.9.9" && exit 0\nexit 1\n' > roto && chmod +x roto
          if sudo gordurasfm-update --binary ./roto; then echo "la actualización rota debía fallar"; exit 1; fi
          ! /usr/local/bin/gordurasfm version | grep -q 9.9.9
          curl -fsS http://127.0.0.1:8090/api/v1/salud
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
      - name: Versión en GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "GordurasFM $GITHUB_REF_NAME" \
            dist/gordurasfm-x86_64-linux-musl dist/gordurasfm-aarch64-linux-musl dist/SHA256SUMS

  docker:
    needs: binarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: chmod +x dist/linux/*/gordurasfm
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Imagen amd64 y prueba
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gordurasfm:prueba
      - name: Arranca, pasa el healthcheck y responde
        run: |
          docker images gordurasfm:prueba --format '{{.Size}}'
          docker run -d --name gfm -p 18090:8090 gordurasfm:prueba
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' gfm); [ "$s" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' gfm | grep -qx healthy
          curl -fsS http://127.0.0.1:18090/api/v1/salud
          docker exec gfm /gordurasfm backup
          docker logs gfm 2>&1 | tail -5
      - name: Imagen arm64 (emulada) arranca
        run: |
          docker buildx build --platform linux/arm64 --load -t gordurasfm:arm64 .
          docker run --rm --platform linux/arm64 gordurasfm:arm64 version
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Publicar en ghcr.io (amd64 + arm64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
