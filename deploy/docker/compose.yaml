# Navidrome + OwnFM con Docker Compose.
#   1. Cambia la ruta de tu música y las URL.
#   2. docker compose up -d
#   3. Entra en http://<IP>:8090 con tu cuenta de Navidrome, crea un token de escucha y pégalo en
#      Navidrome → Personal → ListenBrainz.
#
# Si ya tienes Navidrome, quita su servicio y pon en el tuyo ND_LISTENBRAINZ_BASEURL apuntando a OwnFM.

services:
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_LISTENBRAINZ_ENABLED: "true"
      # Navidrome manda aquí las escuchas (red interna de Compose).
      ND_LISTENBRAINZ_BASEURL: "http://ownfm:8090/1/"
    volumes:
      - navidrome-data:/data
      - /ruta/a/tu/musica:/music:ro

  ownfm:
    image: ghcr.io/miausalvaje/ownfm:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      OWNFM_NAVIDROME_URL: "http://navidrome:4533"
      OWNFM_PUBLIC_URL: "http://localhost:8090"   # la URL con la que entras desde el navegador
      OWNFM_DEFAULT_TIMEZONE: "Europe/Madrid"
      # OWNFM_LASTFM_API_KEY: "..."
      # OWNFM_LASTFM_API_SECRET: "..."
    volumes:
      # Volumen con nombre: Docker le da el dueño correcto (usuario 65532). Si usas una carpeta
      # del host, antes: sudo chown 65532:65532 <carpeta>
      - ownfm-data:/data

volumes:
  navidrome-data:
  ownfm-data:
